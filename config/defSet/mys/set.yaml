# 公共查询是否使用用户ck  0-不使用 1-使用
allowUseCookie: 1
# 默认cookie帮助文档链接地址
cookieDoc: https://docs.qq.com/doc/DUWNVQVFTU3liTVlO

# 帖子评论最大条数
commentMaxNum: 10
# 帖子评论排序 3热门 2最新 1最早
commentSort: 3
# 米游社公告资讯推送开关权限
newsPermission: master
# 原神星铁活动推送开关权限
activityPermission: master
# 别名设置权限 0-所有群员都可以添加 1-群管理员才能添加 2-主人才能添加
abbrSetAuth: 0
# 米游社原神攻略图默认来源设置 1-西风驿站 2-原神观测枢 3-派蒙喵喵屋 4-OH是姜姜呀
defaultSource: 1
# 米游社星铁攻略图默认来源设置 1-听语惊花 2-紫喵Azunya 3-祈鸢ya 4-初始镜像&星穹中心 5-小橙子阿 6-Asgater
srdefaultSource: 1
