<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="shortcut icon" href="#" />
  <link rel="stylesheet" type="text/css" href="{{gameResPath}}html/deck/deckList.css" />
  {{@headIndexStyle}}
</head>
<body>
  <div class="container" id="container">
    <div class="head_box">
      <div class="role-name">
        {{nickname}} lv.{{level}}
      </div>
      <div class="id_text">
        UID: {{uid}}
      </div>
      <img class="genshin_logo" src="{{gameResPath}}img/other/logo.png" />
    </div>
    <div style="height: 12px;"></div>
    {{each Data vals}}
    <div class="basicInfo">
      <div class="tab_lable">七圣卡组{{vals.id}} 使用#七圣查询卡组{{vals.id}}查看详情</div>
      <div style="height: 10px;"></div>
      <div class="avatar_covers">
        {{each vals.avatar_cards val}}
        <div class="card-wrapper">
          <div class="overlay">
            <img src="{{gameResPath}}img/deck/边框.png" alt="">
          </div>
          <div class="overlay">
            <div class="rq-container">
              <img src="{{gameResPath}}img/deck/容器.png" alt="">
            </div>
            <div class="hp-container">
              <img src="{{gameResPath}}img/deck/{{val.hp}}.png" alt="">
            </div>
          </div>
          <img src="{{val.image}}" alt="">
        </div>
        {{/each}}
      </div>
    </div>
    {{/each}}
    <div class="logo">{{layoutcopyright}}</div>
  </div>
</body>
</html>
