<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <link rel="shortcut icon" href="#"/>
    <link rel="stylesheet" type="text/css" href="{{gameResPath}}html/weapon/weapon.css"/>
</head>
<body {{if avatars.length<=8}}class="list8" {{/if}}>
<div class="container" id="container">
    <div class="main_box">
        <div class="base_info">
            <div class="uid">UID: {{uid}}</div>
            {{if avatars.length>8}}
            <div class="lab">
            </div>
            {{/if}}
        </div>
        <div class="item_box">
            {{each avatars avatar idx}}
            <div class="item">
                <span class="user item-icon star{{avatar.rarity}}" style="background-image:url('{{metaGs}}character/{{avatar.name}}/imgs/side{{avatar.costumes?.length > 0 ? '2' : ''}}.webp')"></span>
                <div class="role_box">
                    {{if avatar.weapon_affix_level>1}}
                    <span class="life life{{avatar.weapon_affix_level}}">{{avatar.weapon_affix_level}}</span>
                    {{/if}}
                    <div class="bg{{avatar.weapon_rarity}}"></div>
                    <img class="role_img" src="{{_miao_path}}{{avatar.weapon.icon}}" onerror="whenError(this)"/>
                    <div class="desc">Lv.{{avatar.weapon_level}}</div>
                    <img class="fill_img" src="{{gameResPath}}img/other/fill.png"/>
                </div>
                <div class="role_name">{{abbr[avatar.weapon_name] || avatar.weapon_name}}</div>
            </div>
            {{/each}}
        </div>
        <div class="tips">*仅显现已装备的武器</div>
    </div>
</div>
</body>
</html>
