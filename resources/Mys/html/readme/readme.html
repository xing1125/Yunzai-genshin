<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能列表</title>
    {{block 'css'}}
    <link rel="stylesheet" type="text/css" href="{{pluResPath}}Mys/html/readme/readme.css" />
    {{/block}}
</head>
<body>
    <div class="container">
        {{each sections}}
        <div class="section">
            <h2>{{$value.title}}</h2>
            {{if $value.tables && $value.tables.length > 0}}
            {{each $value.tables}}
            <table>
                {{each $value.rows}}
                <tr>
                    {{each $value}}
                    <td>{{@ $value}}</td>
                    {{/each}}
                </tr>
                {{/each}}
            </table>
            {{/each}}
            {{/if}}
        </div>
        {{/each}}
    </div>
</body>

</html>
