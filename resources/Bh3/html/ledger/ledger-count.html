{{extend gameLayout}}
{{block 'css'}}
<link rel="stylesheet" type="text/css" href="{{gameResPath}}html/ledger/ledger-count.css"/>
{{/block}}
{{block 'main'}}
<div class="head_box">
  <div class="bh3_id_text">UID: {{uid}}</div>
  <h2 class="bh3_day_text">{{yearText}}水晶统计</h2>
  <img class="bh3_logo" src="{{gameResPath}}img/other/logo.png"/>
</div>

<div class="data_box">
  <div class="tab_lable">数据总览</div>
  <div class="data_line">
    <div class="data_line_item">
      <div class="num">{{allPrimogemsShow}}</div>
      <div class="lable">总水晶</div>
    </div>
    <div class="data_line_item">
      <div class="num">{{maxPrimogems.month}}月</div>
      <div class="lable">水晶最多</div>
    </div>
    <div class="data_line_item">
      <div class="num">{{maxPrimogems.value}}</div>
      <div class="lable">{{maxPrimogems.month}}月水晶</div>
    </div>
    <div class="data_line_item">
      <div class="num">{{allMora}}</div>
      <div class="lable">总星石</div>
    </div>
  </div>
</div>

<div class="data_box">
  <div class="tab_lable">月份统计</div>
  <div id="chartContainer"></div>
</div>

<div class="data_box">
  <div class="tab_lable">详细统计</div>
  <div id="chartContainer2"></div>
</div>

{{if hasMore}}
<div class="hasMore">*该数据只显示最近12个月</div>
{{/if}}

<script type="text/javascript" src="{{pluResPath}}other/script/g2plot.min.js"></script>
<script>
  const { Column, Pie } = G2Plot
  const primogemsMonth = JSON.parse(`{{@ primogemsMonth}}`)
  const countdata = JSON.parse(`{{@ pieData}}`)

  const stackedColumnPlot = new Column('chartContainer', {
    data: primogemsMonth,
    isGroup: true,
    xField: 'month',
    yField: 'value',
    seriesField: 'name',
    animation: false,
    renderer: 'svg',
    padding: [40, 10, 30, 52],
    label: {
      position: 'top',
      style: {
        fontFamily: 'Number'
      },
      offsetY: 10
    },
    legend: {
      position: 'top-left',
      itemName: {
        style: {
          fontFamily: 'SR',
          fontSize: 14
        }
      }
    },
    xAxis: {
      label: {
        autoHide: false,
        formatter: (v) => `${v}月`,
        style: {
          fontFamily: 'SR',
          fontSize: 14
        }
      }
    },
    yAxis: {
      label: {
        style: {
          fontFamily: 'Number',
          fontSize: 14
        }
      }
    }
  })
  stackedColumnPlot.render()

  if (countdata.length > 0) {
    const piePlot = new Pie('chartContainer2', {
      renderer: 'svg',
      animation: false,
      data: countdata,
      appendPadding: 10,
      angleField: 'num',
      colorField: 'action',
      radius: 1,
      innerRadius: 0.7,
      color: JSON.parse(`{{@ color}}`),
      label: {
        type: 'inner',
        offset: '-50%',
        autoRotate: false,
        style: {
          textAlign: 'center',
          fontFamily: 'Number'
        },
        formatter: ({ percent }) => {
          percent = (percent * 100).toFixed(0)
          return percent >= 2 ? `${percent}%` : ''
        }
      },
      statistic: {
        title: {
          offsetY: -8,
          content: '总计'
        },
        content: {
          style: {
            fontFamily: 'Number'
          }
        }
      },
      legend: {
        offsetX: -56,
        itemValue: {
          formatter: (text, item) => {
            const items = countdata.filter((d) => d.action === item.value)[0]
            return items ? items.num : ''
          },
          style: {
            opacity: 0.65,
            fontFamily: 'Number',
            fontSize: 16
          }
        },
        itemName: {
          style: {
            fontSize: 16,
            fontFamily: 'SR'
          }
        }
      }
    })
    piePlot.render()
  }
</script>
{{/block}}
